<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SarvaCart — a cinematic luxury marketplace for fashion, fine jewellery, and future-tech. Premium product storytelling, immersive 3D visuals, and concierge service." />
    <meta name="theme-color" content="#0a0a0c" />
    <meta property="og:title" content="SarvaCart — Luxury, reimagined." />
    <meta property="og:description" content="A cinematic luxury marketplace for fashion, fine jewellery, and future-tech." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <link rel="manifest" href="/src/manifest.webmanifest" />
    <title>SarvaCart — Luxury, Reimagined</title>
    <style>
      html, body { margin: 0; background: #0a0a0c; }
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0a0a0c; color: #e8cf8f;
        font-family: Georgia, serif;
      }
      #boot .logo { font-size: 2rem; font-weight: 700; letter-spacing: 0.05em; }
      #boot .logo span { color: #b8860b; }
      #boot .bar { width: 160px; height: 3px; margin-top: 16px; background: rgba(232,207,143,.15); border-radius: 2px; overflow: hidden; }
      #boot .bar i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg,#e8cf8f,#b8860b); animation: load 1.1s ease-in-out infinite; }
      @keyframes load { 0% { transform: translateX(-110%);} 100% { transform: translateX(320%);} }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="logo">Sarva<span>Cart</span></div>
      <div class="bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
